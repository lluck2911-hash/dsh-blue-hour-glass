name: Publish release artifacts
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - run: node --test tests/package.test.mjs
      - run: python3 scripts/pack.py
      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz dist/*-source.zip dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/*-source.zip dist/SHA256SUMS --title "Coastal Sunset · Blue Hour Frosted Glass $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
